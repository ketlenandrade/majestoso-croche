<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Peças em crochê feitas à mão. Encomendas pelo WhatsApp.">
<title>Majestoso Crochê</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Montserrat:wght@400;500&display=swap">
<style>
/* Layout: uma coluna estreita centrada, como uma etiqueta de peça artesanal; logo no topo, links empilhados, ponto corrente como divisor */
:root{
  --vinho:#300307; --vinho-2:#45080f; --vinho-3:#5a1119;
  --ouro:#E6BC86; --ouro-claro:#F6D9A8; --ouro-escuro:#B98451;
  --texto:#F3DDBA; --texto-suave:#C9A57C;
  --f-display:"Cinzel","Times New Roman",serif;
  --f-corpo:"Cormorant Garamond",Georgia,serif;
  --f-util:"Montserrat",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{min-height:100%}
body{
  background:var(--vinho);
  background-image:radial-gradient(ellipse 80% 50% at 50% 0%, var(--vinho-3) 0%, transparent 70%);
  color:var(--texto); font-family:var(--f-corpo);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:32px 48px;
}
.wrap{max-width:440px;margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:22px}
.logo{width:100%;max-width:360px;height:auto;display:block}
.bio{font-size:1.25rem;font-style:italic;text-align:center;line-height:1.45;color:var(--texto);margin:0;text-wrap:balance}
.meta{font-family:var(--f-util);font-size:.72rem;letter-spacing:.22em;text-transform:uppercase;color:var(--texto-suave);text-align:center;margin:0}
.corrente{display:flex;gap:3px;justify-content:center;align-items:center;width:100%;overflow:hidden;height:12px}
.corrente span{flex:0 0 16px;height:8px;border:1.5px solid var(--ouro-escuro);border-radius:50%}
.links{list-style:none;padding:0;margin:0;width:100%;display:flex;flex-direction:column;gap:12px}
.links a{
  display:grid;grid-template-columns:40px 1fr 18px;align-items:center;gap:14px;
  padding:14px 18px;border-radius:999px;text-decoration:none;
  color:var(--ouro-claro);background:var(--vinho-2);
  border:1px solid color-mix(in srgb,var(--ouro) 45%,transparent);
  transition:transform .18s ease,background .18s ease,border-color .18s ease;
}
.links a:hover{transform:translateY(-2px);background:var(--vinho-3);border-color:var(--ouro)}
.links a:focus-visible{outline:2px solid var(--ouro-claro);outline-offset:3px}
.links a.destaque{background:linear-gradient(135deg,var(--ouro-claro),var(--ouro) 55%,var(--ouro-escuro));color:var(--vinho);border-color:transparent}
.links a.destaque .ic{background:var(--vinho);color:var(--ouro-claro)}
.links a.destaque small{color:var(--vinho-3)}
.ic{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--ouro) 14%,transparent);color:var(--ouro)}
.ic svg{width:20px;height:20px}
.txt{display:flex;flex-direction:column;gap:2px;min-width:0}
.txt strong{font-family:var(--f-display);font-weight:600;font-size:.98rem;letter-spacing:.08em}
.txt small{font-family:var(--f-util);font-size:.74rem;color:var(--texto-suave);letter-spacing:.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seta{width:18px;height:18px;opacity:.7}
footer{font-family:var(--f-util);font-size:.68rem;letter-spacing:.2em;text-transform:uppercase;color:var(--texto-suave);text-align:center;margin-top:8px}
@media (prefers-reduced-motion:reduce){.links a{transition:none}.links a:hover{transform:none}}
</style>
<style>*,*::before,*::after{box-sizing:border-box}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}</style>
